<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Music Player</title>
    <style>
        body {
            padding: 25px;
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: white;
        }
        #playlist {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        .song {
            background: #1e1e1e;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            width: 150px;
        }
        .song img {
            width: 100px;
            height: 100px;
            object-fit: cover;
        }
        .song button {
            margin-top: 10px;
            padding: 5px 10px;
            background: #5C6AC4;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        #audioPlayer {
            margin-top: 20px;
            width: 100%;
        }
    </style>
</head>
<body>
    <h1>Music Player</h1>
    <div id="playlist"></div>
    <audio id="audioPlayer" controls></audio>
    <script>
        const repoOwner = 'zacharyceiley-jpg';
        const repoName = 'secret-Unblocked-Listen';
        const branch = 'main';
        const apiUrl = `https://api.github.com/repos/${repoOwner}/${repoName}/contents?ref=${branch}`;
        const rawBaseUrl = `https://raw.githubusercontent.com/${repoOwner}/${repoName}/${branch}/`;

        async function fetchFiles() {
            try {
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error(`API error: ${response.status}`);
                const files = await response.json();
                const mp3Files = files.filter(file => file.name.endsWith('.mp3')).sort((a, b) => a.name.localeCompare(b.name));
                const pngFiles = files.filter(file => file.name.endsWith('.png'));
                displayPlaylist(mp3Files, pngFiles);
            } catch (error) {
                console.error('Error fetching files:', error);
                const playlist = document.getElementById('playlist');
                playlist.innerHTML = '<p>Error loading songs. Check console for details.</p>';
            }
        }

        function displayPlaylist(mp3Files, pngFiles) {
            const playlist = document.getElementById('playlist');
            mp3Files.forEach(file => {
                const songDiv = document.createElement('div');
                songDiv.className = 'song';
                
                const pngFile = pngFiles.find(png => png.name.replace('.png', '') === file.name.replace('.mp3', ''));
                if (pngFile) {
                    const img = document.createElement('img');
                    img.src = rawBaseUrl + pngFile.name;
                    img.onerror = () => img.style.display = 'none';
                    songDiv.appendChild(img);
                }
                
                const title = document.createElement('p');
                title.textContent = file.name.replace('.mp3', '');
                songDiv.appendChild(title);
                
                const playBtn = document.createElement('button');
                playBtn.textContent = 'Play';
                playBtn.onclick = () => playSong(file.name);
                songDiv.appendChild(playBtn);
                
                playlist.appendChild(songDiv);
            });
        }

        function playSong(filename) {
            const audioPlayer = document.getElementById('audioPlayer');
            audioPlayer.src = rawBaseUrl + filename;
            audioPlayer.play().catch(e => console.error('Playback error:', e));
        }

        fetchFiles();
    </script>
</body>
</html>
